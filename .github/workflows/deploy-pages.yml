name: Build docs

# 推送 main 时自动构建，并把产物同步到 docs/ 目录
# GitHub Pages 只需一次性设为「Deploy from a branch: main / docs」，之后每次推送都会自动更新
#
# 说明：这里刻意不使用 actions/deploy-pages。
# 因为用 Actions 默认 token 无法通过 API「创建」Pages 站点（会 403），
# 而「构建产物提交到 docs/」的方式不依赖任何 Pages API 权限，更稳。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-docs
  cancel-in-progress: true

jobs:
  build:
    # 跳过机器人自己产生的提交，避免无限循环
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 数据分片生成脚本直接 import TS 数据模块（Node 原生类型擦除），
          # 需要 Node ≥ 22.18；这里固定 24 与本地保持一致
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Sync dist to docs
        run: |
          rm -rf docs
          mkdir -p docs
          cp -r dist/. docs/
          ls -a docs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --staged --quiet; then
            echo "docs/ 无变化，跳过提交"
          else
            git commit -m "chore: rebuild docs [skip ci]"
            git push
          fi
